name: CI
on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - data/words.ljson
      - data/words.idx
      - CHANGELOG.md
  pull_request:

env:
  # Pin until Node 24.16.0's extract-zip/yauzl regression is fixed. It can
  # leave WebdriverIO's ChromeDriver download partially extracted in CI:
  # https://github.com/nodejs/node/issues/63487
  NODE_VERSION: 24.15.0

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Check the build works. No need to run the build:edge target since it's
      # almost identical to build:chrome
      - name: Build
        run: |-
          pnpm install --frozen-lockfile
          pnpm build:firefox
          pnpm build:chrome
          pnpm build:thunderbird

      # TEMPORARY: diagnose why Firefox never connects back to Vitest on this
      # runner (the browser (firefox) project times out after 60s while
      # browser (chrome) passes). To be removed once the cause is known.
      - name: Diagnose Firefox
        run: |-
          set -x
          which firefox && readlink -f "$(which firefox)" || true
          firefox --version || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo aa-status 2>&1 | head -20 || true
          ls /etc/apparmor.d || true
          getent hosts localhost || true
          ip -brief addr || true
          df -h /dev/shm || true
          env | grep -iE 'proxy|no_proxy' || echo 'no proxy vars'
          unshare --user --map-root-user true && echo 'userns OK' || echo 'userns BLOCKED'
          python3 -m http.server 8199 --bind 127.0.0.1 >/dev/null 2>&1 &
          timeout 10 bash -c 'until curl -sf -o /dev/null http://localhost:8199/; do sleep 0.2; done' || true
          timeout 90 firefox --headless --screenshot /tmp/ff-remote.png https://example.com/ \
            && echo 'firefox screenshot (remote) OK' || echo "firefox screenshot (remote) FAILED rc=$?"
          timeout 90 firefox --headless --screenshot /tmp/ff-local.png http://localhost:8199/ \
            && echo 'firefox screenshot (localhost) OK' || echo "firefox screenshot (localhost) FAILED rc=$?"

      - name: Run tests
        env:
          CI: true
          # TEMPORARY: verbose browser-provider logging for the diagnosis above
          DEBUG: vitest:*
          WDIO_LOG_LEVEL: debug
        run: pnpm test

      - name: Upload any failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-screenshots
          path: '**/__screenshots__/**/*.png'
          if-no-files-found: ignore
          retention-days: 20

      # Check packaging doesn't error. Again, no need to worry about the
      # package:edge target.
      - name: Package
        run: |-
          pnpm package:firefox
          pnpm package:chrome

      - name: Verify cosmos setup
        run: pnpm cosmos-export

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm oxlint --type-aware scripts src tests "*.{cjs,js,ts}"

      - name: Check formatting
        run: pnpm prettier --check _locales css scripts src tests "*.{js,json,md,ts}"

      - name: knip
        run: pnpm knip
